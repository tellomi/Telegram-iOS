appId: app.tellomi.chat
---
- tapOn:
    id: "Auth.Welcome.StartButton"
    optional: true
- tapOn:
    text: "Start Messaging|开始聊天"
    optional: true
- tapOn:
    id: "Auth.PhoneEntry.CountryCodeField"
- eraseText: 8
- inputText: "999"
- tapOn:
    id: "Auth.PhoneEntry.PhoneNumberField"
- inputText: ${PHONE_NATIONAL}
- tapOn:
    id: "Auth.PhoneEntry.ContinueButton"
- takeScreenshot: phone-entered
- extendedWaitUntil:
    visible: "Enter code|输入验证码|Phone verification|电话验证|验证码"
    timeout: 90000
- tapOn:
    id: "Auth.CodeEntry.CodeField"
    optional: true
- inputText: ${CODE}
- takeScreenshot: code-entered
- runFlow:
    when:
      visible: "我已阅读并同意|Your name|First name|你的名字|名字"
    commands:
      - tapOn:
          id: "Auth.SetName.FirstNameField"
          optional: true
      - inputText: ${FIRST_NAME}
      - tapOn:
          text: "我已阅读并同意.*"
          point: "8%,50%"
          optional: true
      - tapOn:
          id: "Auth.SetName.AgreementCheckbox"
          optional: true
      - tapOn:
          id: "Auth.SetName.ContinueButton"
- extendedWaitUntil:
    visible: "发现|Discover|Search|搜索|New Message|新消息|聊天|Chats"
    timeout: 120000
- tapOn:
    text: "Not now|以后再说|稍后|Skip|跳过|Don't Allow|不允许|Later|Cancel|取消"
    optional: true
    repeat: 3
    delay: 400
- takeScreenshot: logged-in
