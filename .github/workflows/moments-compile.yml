# Compile check for the Moments feed PR (#139).
#
# Same release_arm64 build as testflight.yml, without the upload: it builds
# bazel-bin/Telegram/Telegram.ipa and stops. It runs only for the Moments
# branch, never on a push to release/ios, and never calls altool.

name: Moments compile

on:
  pull_request:
    branches: [release/ios]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: moments-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    if: github.head_ref == 'cursor/moments-comment-api-b405' || github.head_ref == 'cursor/moments-feed-parity-f601'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
      APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
      APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout submodules
        run: bash .github/checkout-submodules.sh

      - name: Select Xcode from versions.json
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          CANDIDATE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$CANDIDATE" ]; then
            echo "Xcode ${XCODE_VERSION} is not installed on this runner."
            ls -1 /Applications | grep -E '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "${CANDIDATE}/Contents/Developer"
          xcodebuild -version

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/telegram-bazel-cache
          key: tellomi-bazel-none
          restore-keys: |
            tellomi-bazel-

      - name: Prepare signing
        run: |
          set -euo pipefail
          python3 Tellomi/prepare_appstore_signing.py \
            --configuration build-system/appstore-configuration.json \
            --configuration-out "${RUNNER_TEMP}/tellomi-configuration.json" \
            --output "${RUNNER_TEMP}/tellomi-signing" \
            --cert-dir "${GITHUB_WORKSPACE}/tellomi-distribution-cert" \
            --build-number-out "${RUNNER_TEMP}/build-number.txt" \
            --build-number-floor "${{ github.run_number }}"
          echo "BUILD_NUMBER=$(tr -d '[:space:]' < "${RUNNER_TEMP}/build-number.txt")" >> "${GITHUB_ENV}"

      - name: Import signing certificate
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path "${RUNNER_TEMP}/tellomi-signing/certs"

      - name: Build release IPA (no upload)
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir /Users/runner/telegram-bazel-cache \
            build \
            --configurationPath "${RUNNER_TEMP}/tellomi-configuration.json" \
            --codesigningInformationPath "${RUNNER_TEMP}/tellomi-signing" \
            --configuration release_arm64 \
            --buildNumber "${BUILD_NUMBER}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          test -f bazel-bin/Telegram/Telegram.ipa
          echo "Built bazel-bin/Telegram/Telegram.ipa. Not uploaded."

      - name: Run MomentsRulesTests
        run: |
          set -euo pipefail
          # xctestrunner builds a runtime id itself and hides the simctl error
          # behind exit 15. Create the simulator here, from the runtime id
          # simctl actually lists, and hand that device to the test runner.
          SIM_UDID="$(python3 - << 'PY'
          import json, subprocess, sys
          def simctl(*args):
              result = subprocess.run(["xcrun", "simctl", *args], text=True, capture_output=True)
              if result.returncode != 0:
                  sys.stderr.write(result.stdout)
                  sys.stderr.write(result.stderr)
                  raise SystemExit(result.returncode)
              return result.stdout
          runtimes = json.loads(simctl("list", "runtimes", "-j"))["runtimes"]
          ios = [r for r in runtimes if str(r.get("name", "")).startswith("iOS") and r.get("isAvailable", True)]
          if not ios:
              sys.exit("no available iOS simulator runtime")
          runtime = next((r for r in ios if r.get("name") in ("iOS 27.1", "iOS 27.1.0")), ios[-1])
          runtime_id = runtime["identifier"]
          existing = json.loads(simctl("list", "devices", "available", "-j")).get("devices", {}).get(runtime_id, [])
          iphones = [d for d in existing if "iPhone" in d.get("name", "") and d.get("isAvailable", True) and d.get("udid")]
          if iphones:
              sys.stderr.write("available iPhones: %s\n" % ", ".join(d["name"] for d in iphones))
              regular = [d for d in iphones if "Duo" not in d["name"]]
              chosen = (regular or iphones)[0]
              sys.stderr.write("reusing %s %s on %s\n" % (chosen["udid"], chosen["name"], runtime.get("name")))
              print(chosen["udid"])
              sys.exit(0)
          supported = [d for d in (runtime.get("supportedDeviceTypes") or []) if "iPhone" in d.get("name", "")]
          if not supported:
              supported = [d for d in json.loads(simctl("list", "devicetypes", "-j"))["devicetypes"] if d["name"].startswith("iPhone")]
              sys.stderr.write("no supportedDeviceTypes on %s\n" % runtime.get("name"))
          sys.stderr.write("iPhone candidates: %s\n" % ", ".join(d["name"] for d in supported[:6] + supported[-6:]))
          # The list order is not stable across Xcode versions, so try both ends.
          ordered = []
          seen = set()
          for device in list(supported[:6]) + list(reversed(supported[-6:])):
              key = device.get("identifier") or device["name"]
              if key not in seen:
                  seen.add(key)
                  ordered.append(device)
          last = "no compatible iPhone for %s" % runtime.get("name")
          for device in ordered:
              token = device.get("identifier") or device["name"]
              result = subprocess.run(
                  ["xcrun", "simctl", "create", "MomentsRules", token, runtime_id],
                  text=True, capture_output=True)
              if result.returncode == 0 and result.stdout.strip():
                  sys.stderr.write("simulator %s %s %s\n" % (result.stdout.strip(), device.get("name"), runtime_id))
                  print(result.stdout.strip())
                  sys.exit(0)
              last = (result.stdout + result.stderr).strip()
              sys.stderr.write("create %s failed: %s\n" % (device.get("name"), last))
          sys.exit(last)
          PY
          )"
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir /Users/runner/telegram-bazel-cache \
            test \
            --configurationPath "${RUNNER_TEMP}/tellomi-configuration.json" \
            --codesigningInformationPath "${RUNNER_TEMP}/tellomi-signing" \
            --target //submodules/TelegramCore:MomentsRulesTests \
            --testFilter MomentsRulesTests \
            --testOutput all \
            --testArg=--destination=platform=ios_simulator,id=${SIM_UDID}

      - name: Summarize compiler errors
        if: failure()
        run: |
          grep -E "error:|ERROR:" "${RUNNER_TEMP}/build.log" | sort -u | head -200 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moments-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
