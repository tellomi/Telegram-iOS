# Runs the Tellomi MTProto seed tests. Objective-C here is compiled by
# `swift test` on the macOS runner, the same way Official sim does.
# Official sim itself only starts for one restore branch against master,
# so this job is what executes MTSeedFallbackTests on a release/ios pull request.
# It does not build the app and it does not upload to TestFlight.

name: MtProtoKit tests

on:
  pull_request:
    branches: [release/ios]
    paths:
      - "submodules/MtProtoKit/**"
      - "Tellomi/tellomi-server.json"
      - "Tellomi/generate_server_config.py"
      - ".github/workflows/mtproto-tests.yml"

permissions:
  contents: read

concurrency:
  group: mtproto-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seed-fallback:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Select Xcode from versions.json
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          CANDIDATE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$CANDIDATE" ]; then
            echo "Xcode ${XCODE_VERSION} is not installed on this runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=${CANDIDATE}/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="${CANDIDATE}/Contents/Developer"
          xcodebuild -version

      - name: Run MTSeedFallbackTests
        run: |
          set -euo pipefail
          swift test --package-path submodules/MtProtoKit \
            --filter MTSeedFallbackTests
